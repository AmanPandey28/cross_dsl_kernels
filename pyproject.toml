[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossdsl-kernels"
version = "0.0.0"
description = "Measured transformer memory and decode kernels in CUDA, Triton and CuTe DSL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.10"]

[project.optional-dependencies]
gpu = ["triton==3.6.0", "nvidia-cutlass-dsl==4.5.2", "cuda-bindings==13.0.3", "ninja"]
plots = ["matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/AmanPandey28/cross_dsl_kernels"

[tool.setuptools.packages.find]
where = ["src"]
