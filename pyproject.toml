[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossdsl-kernels"
version = "0.1.0"
description = "Cross-DSL GPU kernel implementations of transformer-inference primitives (RMSNorm, GEMV, RoPE paged-KV)"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "torch>=2.5",
    "triton>=3.0",
    "nvidia-cutlass-dsl>=4.5",
]

[tool.setuptools.packages.find]
where = ["src"]
